# Build the site with base /Kathryn_web and deploy it to GitHub Pages at
# https://tanawin1701d.github.io/Kathryn_web/ on every push to master.
#
# This is a MIRROR of the primary Cloudflare Pages deploy (deploy.yml) —
# kathryn-tools.org stays the canonical URL; the mirror exists so the site is
# reachable from networks whose URL filters block the young custom domain.
# No secrets needed: it uses the repo's own GitHub Pages (source must be set
# to "GitHub Actions" in Settings → Pages, done once via the API).
name: Deploy GitHub Pages mirror

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with base path
        run: npm run build
        env:
          KAT_BASE: /Kathryn_web

      - name: Prefix content links with base
        run: node scripts/prefix-base-links.mjs dist /Kathryn_web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
