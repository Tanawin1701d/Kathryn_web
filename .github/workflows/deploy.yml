# Build the site and deploy it to Cloudflare Pages (project: kathryn-web,
# served at https://kathryn-tools.org) on every push to master.
#
# Requires ONE repository secret: CLOUDFLARE_API_TOKEN — a Cloudflare API
# token created from the "Cloudflare Pages — Edit" template
# (dash.cloudflare.com → My Profile → API Tokens). The account ID below is
# not a secret.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate mermaid diagrams
        run: npm run check:mermaid

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a9a3fbe65119deeb9490b5f771e2a669
          command: pages deploy dist --project-name=kathryn-web --branch=master
